  study_design: 'Trial-based paradigm with sustained movements/motor imagery. Each trial: fixation cross at 0s, cue presentation
    at 2s, sustained movement/MI execution. Subjects performed both movement execution (ME) and motor imagery (MI) in separate
    sessions.'
  synchronicity: synchronous
file_format: gdf
methodology: Subjects performed 6 sustained upper limb movements (elbow flexion/extension, forearm supination/pronation, hand
  open/close) plus rest in two separate sessions (movement execution and motor imagery). EEG was recorded from 61 channels,
  filtered to 0.3-3 Hz, and classified using shrinkage LDA with discriminative spatial patterns. Source localization was performed
  using sLORETA. Classification employed both single time-point and time-window approaches with 10x10-fold cross-validation.
